<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Control de vehículos</title>

    <link
        rel="stylesheet"
        href="css/vehiculos.css"
    >
</head>

<body>

<main class="vehicles-app">

    <!-- CABECERA -->
    <header class="app-header">

        <a
            href="index.html"
            class="back-button"
            aria-label="Volver"
        >
            ←
        </a>

        <div>
            <h1>Control de vehículos</h1>
            <p>Reservas familiares</p>
        </div>

    </header>


    <!-- CALENDARIO -->
    <section class="calendar-card">

        <div class="calendar-header">

            <button
                id="previousMonth"
                class="month-button"
                aria-label="Mes anterior"
            >
                ‹
            </button>

            <h2 id="monthTitle"></h2>

            <button
                id="nextMonth"
                class="month-button"
                aria-label="Mes siguiente"
            >
                ›
            </button>

        </div>


        <div class="weekdays">
            <span>L</span>
            <span>M</span>
            <span>X</span>
            <span>J</span>
            <span>V</span>
            <span>S</span>
            <span>D</span>
        </div>


        <div
            id="calendar"
            class="calendar-grid"
        ></div>


        <button
            id="todayButton"
            class="today-button"
        >
            Ir a hoy
        </button>

    </section>


    <!-- RESERVAS DEL DÍA -->
    <section class="day-section">

        <div class="section-title">

            <div>
                <span class="section-label">
                    RESERVAS
                </span>

                <h2 id="selectedDateTitle"></h2>
            </div>

            <button
                id="addReservationButton"
                class="add-button"
                aria-label="Nueva reserva"
            >
                +
            </button>

        </div>


        <div
            id="reservationsList"
            class="reservations-list"
        ></div>

    </section>

</main>


<!-- =====================================================
     MODAL NUEVA RESERVA
     ===================================================== -->

<div
    id="reservationModal"
    class="modal hidden"
>

    <div
        class="modal-overlay"
        id="modalOverlay"
    ></div>


    <div class="modal-content">

        <div class="modal-header">

            <div>
                <span class="section-label">
                    NUEVA RESERVA
                </span>

                <h2 id="modalDateTitle"></h2>
            </div>

            <button
                id="closeModalButton"
                class="close-button"
                aria-label="Cerrar"
            >
                ×
            </button>

        </div>


        <form id="reservationForm">

            <!-- PERSONA -->
            <div class="form-group">

                <label for="person">
                    ¿Quién?
                </label>

                <select
                    id="person"
                    required
                >
                    <option value="">
                        Selecciona una persona
                    </option>

                    <option value="Cristina">
                        Cristina
                    </option>

                    <option value="Raúl">
                        Raúl
                    </option>

                    <option value="Pau">
                        Pau
                    </option>

                    <option value="Lluc">
                        Lluc
                    </option>

                    <option value="Mar">
                        Mar
                    </option>
                </select>

            </div>


            <!-- HORARIOS RECURRENTES -->
            <div
                id="recurringSection"
                class="recurring-section hidden"
            >

                <div class="recurring-title">

                    <div>
                        <span class="section-label">
                            HORARIOS RECURRENTES
                        </span>

                        <strong>
                            Horarios habituales
                        </strong>
                    </div>

                </div>


                <p class="recurring-help">
                    Puedes reutilizar rápidamente un
                    horario que esta persona haya usado
                    anteriormente.
                </p>


                <div
                    id="recurringList"
                    class="recurring-list"
                ></div>

            </div>


            <!-- VEHÍCULO -->
            <div class="form-group">

                <label>
                    ¿Qué vehículo?
                </label>


                <div class="vehicle-options">

                    <label class="vehicle-option">

                        <input
                            type="radio"
                            name="vehicle"
                            value="C3"
                            required
                        >

                        <span class="vehicle-radio"></span>

                        <span class="vehicle-dot c3-dot"></span>

                        <span class="vehicle-info">
                            <strong>C3</strong>
                            <small>Azul</small>
                        </span>

                    </label>


                    <label class="vehicle-option">

                        <input
                            type="radio"
                            name="vehicle"
                            value="C4"
                        >

                        <span class="vehicle-radio"></span>

                        <span class="vehicle-dot c4-dot"></span>

                        <span class="vehicle-info">
                            <strong>C4</strong>
                            <small>Gris</small>
                        </span>

                    </label>


                    <label class="vehicle-option">

                        <input
                            type="radio"
                            name="vehicle"
                            value="Laguna"
                        >

                        <span class="vehicle-radio"></span>

                        <span class="vehicle-dot laguna-dot"></span>

                        <span class="vehicle-info">
                            <strong>Laguna</strong>
                            <small>Verde oscuro</small>
                        </span>

                    </label>

                </div>

            </div>


            <!-- REPETICIÓN -->
            <div class="form-group">

                <label>
                    ¿Cuántos días?
                </label>


                <div class="repeat-options">

                    <label class="repeat-option">

                        <input
                            type="radio"
                            name="repeatType"
                            value="single"
                            checked
                        >

                        <span>
                            Solo este día
                        </span>

                    </label>


                    <label class="repeat-option">

                        <input
                            type="radio"
                            name="repeatType"
                            value="multiple"
                        >

                        <span>
                            Varios días
                        </span>

                    </label>

                </div>

            </div>


            <!-- OPCIONES VARIOS DÍAS -->
            <div
                id="multipleDaysSection"
                class="multiple-days-section hidden"
            >

                <div class="date-range">

                    <div class="form-group">

                        <label for="rangeStart">
                            Desde
                        </label>

                        <input
                            type="date"
                            id="rangeStart"
                        >

                    </div>


                    <div class="form-group">

                        <label for="rangeEnd">
                            Hasta
                        </label>

                        <input
                            type="date"
                            id="rangeEnd"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Repetir los días
                    </label>


                    <div class="weekday-options">

                        <label>
                            <input
                                type="checkbox"
                                value="1"
                                class="weekday-checkbox"
                            >
                            <span>L</span>
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                value="2"
                                class="weekday-checkbox"
                            >
                            <span>M</span>
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                value="3"
                                class="weekday-checkbox"
                            >
                            <span>X</span>
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                value="4"
                                class="weekday-checkbox"
                            >
                            <span>J</span>
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                value="5"
                                class="weekday-checkbox"
                            >
                            <span>V</span>
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                value="6"
                                class="weekday-checkbox"
                            >
                            <span>S</span>
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                value="0"
                                class="weekday-checkbox"
                            >
                            <span>D</span>
                        </label>

                    </div>

                </div>

            </div>


            <!-- HORARIO -->
            <div class="time-row">

                <div class="form-group">

                    <label for="startTime">
                        Desde
                    </label>

                    <input
                        type="time"
                        id="startTime"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="endTime">
                        Hasta
                    </label>

                    <input
                        type="time"
                        id="endTime"
                        required
                    >

                </div>

            </div>


            <!-- ERROR -->
            <p
                id="formError"
                class="form-error"
            ></p>


            <!-- PREVISUALIZACIÓN -->
            <div
                id="bookingPreview"
                class="booking-preview hidden"
            ></div>


            <button
                type="submit"
                class="submit-button"
            >
                Reservar vehículo
            </button>

        </form>

    </div>

</div>


<!-- =====================================================
     MODAL ELIMINAR
     ===================================================== -->

<div
    id="deleteModal"
    class="modal hidden"
>

    <div class="modal-overlay"></div>


    <div class="confirm-content">

        <span class="section-label">
            CONFIRMAR
        </span>

        <h2>Eliminar reserva</h2>

        <p>
            ¿Quieres eliminar esta reserva?
        </p>


        <div class="confirm-buttons">

            <button
                id="cancelDelete"
                class="secondary-button"
            >
                Cancelar
            </button>

            <button
                id="confirmDelete"
                class="delete-button"
            >
                Eliminar
            </button>

        </div>

    </div>

</div>


<script src="js/vehiculos.js"></script>

</body>
</html>
