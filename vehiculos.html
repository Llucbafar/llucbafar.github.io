<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Control de vehículos</title>

    <link rel="stylesheet" href="css/vehiculos.css">
</head>

<body>

    <main class="vehicles-app">

        <!-- CABECERA -->
        <header class="app-header">
            <a href="index.html" class="back-button" aria-label="Volver">
                ←
            </a>

            <div>
                <h1>Control de vehículos</h1>
                <p>Reservas familiares</p>
            </div>
        </header>


        <!-- CALENDARIO -->
        <section class="calendar-card">

            <div class="calendar-header">
                <button id="previousMonth" class="month-button" aria-label="Mes anterior">
                    ‹
                </button>

                <h2 id="monthTitle"></h2>

                <button id="nextMonth" class="month-button" aria-label="Mes siguiente">
                    ›
                </button>
            </div>

            <div class="weekdays">
                <span>L</span>
                <span>M</span>
                <span>X</span>
                <span>J</span>
                <span>V</span>
                <span>S</span>
                <span>D</span>
            </div>

            <div id="calendar" class="calendar-grid"></div>

            <button id="todayButton" class="today-button">
                Ir a hoy
            </button>

        </section>


        <!-- RESERVAS DEL DÍA -->
        <section class="day-section">

            <div class="section-title">
                <div>
                    <span class="section-label">RESERVAS</span>
                    <h2 id="selectedDateTitle"></h2>
                </div>

                <button id="addReservationButton" class="add-button">
                    +
                </button>
            </div>

            <div id="reservationsList" class="reservations-list"></div>

        </section>

    </main>


    <!-- MODAL NUEVA RESERVA -->
    <div id="reservationModal" class="modal hidden">

        <div class="modal-overlay" id="modalOverlay"></div>

        <div class="modal-content">

            <div class="modal-header">
                <div>
                    <span class="section-label">NUEVA RESERVA</span>
                    <h2 id="modalDateTitle"></h2>
                </div>

                <button id="closeModalButton" class="close-button">
                    ×
                </button>
            </div>


            <form id="reservationForm">

                <!-- PERSONA -->
                <div class="form-group">
                    <label for="person">¿Quién?</label>

                    <select id="person" required>
                        <option value="">Selecciona una persona</option>
                        <option value="Cristina">Cristina</option>
                        <option value="Raúl">Raúl</option>
                        <option value="Pau">Pau</option>
                        <option value="Lluc">Lluc</option>
                        <option value="Mar">Mar</option>
                    </select>
                </div>


                <!-- VEHÍCULO -->
                <div class="form-group">
                    <label>¿Qué vehículo?</label>

                    <div class="vehicle-options">

                        <label class="vehicle-option vehicle-c3">
                            <input type="radio" name="vehicle" value="C3" required>
                            <span class="vehicle-radio"></span>

                            <span class="vehicle-info">
                                <strong>C3</strong>
                            </span>
                        </label>


                        <label class="vehicle-option vehicle-c4">
                            <input type="radio" name="vehicle" value="C4">
                            <span class="vehicle-radio"></span>

                            <span class="vehicle-info">
                                <strong>C4</strong>
                            </span>
                        </label>


                        <label class="vehicle-option vehicle-laguna">
                            <input type="radio" name="vehicle" value="Laguna">
                            <span class="vehicle-radio"></span>

                            <span class="vehicle-info">
                                <strong>Laguna</strong>
                                <small>Difícil de reservar</small>
                            </span>
                        </label>

                       <label class="vehicle-option vehicle-any">

                            <input type="radio" name="vehicle" value="Any">
                            <span class="vehicle-radio"></span>

                            <span class="vehicle-info">
                                <strong>Cualquier coche</strong>
                                <small>cualquiera me sirve</small>
                            </span>

                       </label>

                    </div>
                </div>

<!-- RESERVAR TODO EL DÍA -->
<div class="all-day-option">

    <label class="all-day-label">

        <input
            type="checkbox"
            id="allDay"
        >

        <span class="all-day-check"></span>

        <span class="all-day-text">
            <strong>Reservar todo el día</strong>
            <small>00:00 – 23:59</small>
        </span>

    </label>

</div>


                <!-- HORARIOS -->
                <div class="time-row">

                    <div class="form-group">
                        <label for="startTime">Desde</label>
                        <input type="time" id="startTime" required>
                    </div>

                    <div class="form-group">
                        <label for="endTime">Hasta</label>
                        <input type="time" id="endTime" required>
                    </div>

                </div>


                <p id="formError" class="form-error"></p>

                <button type="submit" class="submit-button">
                    Reservar vehículo
                </button>

            </form>

        </div>

    </div>


    <!-- MODAL CONFIRMACIÓN / ELIMINACIÓN -->
    <div id="deleteModal" class="modal hidden">

        <div class="modal-overlay"></div>

        <div class="confirm-content">

            <h2>Eliminar reserva</h2>

            <p>
                ¿Quieres eliminar esta reserva?
            </p>

            <div class="confirm-buttons">
                <button id="cancelDelete" class="secondary-button">
                    Cancelar
                </button>

                <button id="confirmDelete" class="delete-button">
                    Eliminar
                </button>
            </div>

        </div>

    </div>



    <!-- SDK de Supabase via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

   <script src="js/vehiculos.js"></script>

</body>
</html>
