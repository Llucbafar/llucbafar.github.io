<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Mapa de coches</title>

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/mapa.css">
</head>

<body>

<div class="mapa-app">

    <!-- CABECERA -->
    <header class="topbar">

        <div class="titulo-bloque">
            <div class="eyebrow">¿DÓNDE ESTARÁ MI COCHE?</div>
            <h1>Mapa de coches</h1>
        </div>

        <a href="vehiculos.html" class="volver-btn">
            ¡Reserva tu cochecito!
        </a>

    </header>


    <!-- PANEL DE CONTROL -->
    <section class="control-card">

        <div class="control-head">
            <div>
                <h2>¿Qué coche quieres colocar?</h2>
                <p>
                    Selecciona un coche y después toca el mapa.
                    <button class = editar-btn style="display: flex;"> 
                        Editar </button>
                </p>
            </div>
        </div>

        <!-- BOTONES DE COCHES -->
        <div class="coches-selector">
            <button
                type="button"
                class="coche-btn c3"
                data-coche="C3"
            >
                <span>C3</span>
                <small>Azul</small>
            </button>


            <button
                type="button"
                class="coche-btn c4"
                data-coche="C4"
            >
                <span>C4</span>
                <small>Gris</small>
            </button>


            <button
                type="button"
                class="coche-btn laguna"
                data-coche="Laguna"
            >
                <span>Laguna</span>
                <small>Verde</small>
            </button>

        </div>


        <!-- ESTADO -->
        <div class="estado">

            <span class="estado-punto"></span>

            <span id="estadoTexto">
                C3 seleccionado · toca el mapa para colocarlo
            </span>

        </div>

    </section>


    <!-- MAPA -->
    <main class="mapa-contenedor">

        <div id="map"></div>

        <!-- BOTÓN UBICACIÓN -->
        <button
            id="miUbicacion"
            class="ubicacion-btn"
            type="button"
            aria-label="Ir a mi ubicación"
        >
            <span>⌖</span>
        </button>

        <!-- MENSAJE -->
        <div id="mensaje" class="mensaje"></div>

    </main>


</div>


<!-- Leaflet -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
></script>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- JS -->
<script src="js/mapa.js"></script>

</body>
</html>
