<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Portafolio de carteles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #fbfbf9;
    --ink: #0b0b0b;
    --line: 4px;
    --cell: 132px;
    --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--f-display);
    font-size: 16px;
    line-height: 1.5;
  }

  /* Recorrido de scroll: la altura la fija el script según el número de carteles */
  #track { position: relative; height: 500vh; height: 500svh; }

  #viewport {
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100svh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
    background: var(--paper);
  }
  .divider {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 6px;
    margin-left: -3px;
    background: var(--ink);
    z-index: 100;
    pointer-events: none;
  }

  .strip { position: relative; overflow: hidden; min-width: 0; min-height: 0; }

  .panel {
    position: absolute;
    inset: 0;
    background-color: var(--paper);
    background-image:
      linear-gradient(to right, var(--ink) var(--line), transparent var(--line)),
      linear-gradient(to bottom, var(--ink) var(--line), transparent var(--line));
    background-size: var(--cell) var(--cell);
    background-position: -1px -1px;
    will-change: transform;
  }
  .strip.right .panel {
    background-position: calc(-1px - var(--rx, 0px)) calc(-1px - var(--ry, 0px));
  }
  /* El borde grueso va en el lado por el que entra cada cartel */
  .strip.left  .panel:not(:first-child) { border-top: 6px solid var(--ink); transform: translate3d(0, 100%, 0); }
  .strip.right .panel:not(:first-child) { border-bottom: 6px solid var(--ink); transform: translate3d(0, -100%, 0); }

  .inner {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-block: 18px;
    padding-left: 16px;
    padding-right: 16px;
    transform-origin: 50% 50%;
    transform: scale(calc(1 - var(--cover, 0) * 0.05));
    will-change: transform;
  }
  .strip.left  .inner { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .strip.right .inner { padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  .bar {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-family: var(--f-mono);
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .bar span {
    background: var(--paper);
    border: 3px solid var(--ink);
    padding: 3px 9px;
  }

  .stage {
    flex: 1;
    min-height: 0;
    display: grid;
    align-items: center;
    gap: clamp(16px, 2vw, 32px);
    grid-template-columns: 45% minmax(0, 1fr);
    /* grid-template-columns: minmax(0, clamp(400px, 12vw, 430px)) minmax(0, 1fr); */
  }
  /* Alturas distintas: la tira izquierda carga hacia arriba, la derecha hacia abajo */
  .strip.left  .stage { align-content: start; padding-top: 4vh; }
  .strip.right .stage { align-content: end;   padding-bottom: 4vh; }

  .panel.flip .stage { grid-template-columns: 50% minmax(0, 1fr);}
  .panel.flip .poster { order: 2; }
  .panel.flip .label { justify-self: end; }

  .poster {
    margin: 0;
    width: 100%;
    aspect-ratio: 3 / 4;
    max-width: 100%;
    background: var(--paper);
    border: 4px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    overflow: hidden;
  }
  .poster svg, .poster img { display: block; width: 100%; height: 100%; object-fit: cover; }

  .label {
    justify-self: start;
    width: 100%;
    max-width: 27rem;
    background: var(--paper);
    border: 4px solid var(--ink);
    padding: clamp(14px, 1.7vw, 24px);
    display: grid;
    gap: 12px;
    min-width: 0;
  }
  .label h2 {
    margin: 0;
    font-size: clamp(1.2rem, 2.4vw, 2.2rem);
    font-weight: 900;
    font-stretch: 118%;
    line-height: 1;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    text-wrap: balance;
  }
  .label p {
    margin: 0;
    font-size: clamp(0.84rem, 1vw, 1rem);
    line-height: 1.45;
  }
  .meta {
    margin: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 3px 14px;
    padding-top: 12px;
    border-top: 3px solid var(--ink);
    font-family: var(--f-mono);
    font-size: 11.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .meta dt { opacity: 0.6; }
  .meta dd { margin: 0; }

  /* Botones circulares de navegación (inicio y currículum) */
  .nav {
    position: fixed;
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex;
    gap: 12px;
    z-index: 150;
  }
  .circle-btn {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    border: 4px solid var(--ink);
    border-radius: 50%;
    box-shadow: 3px 3px 0 var(--ink);
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
  }
  .circle-btn svg {
    width: 22px;
    height: 22px;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .circle-btn:hover, .circle-btn:focus-visible { background: var(--ink); color: var(--paper); }
  .circle-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* Cartel ampliable */
  .poster { cursor: zoom-in; }
  .poster:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 72px 16px 24px;
    background-color: var(--paper);
    background-image:
      linear-gradient(to right, var(--ink) var(--line), transparent var(--line)),
      linear-gradient(to bottom, var(--ink) var(--line), transparent var(--line));
    background-size: var(--cell) var(--cell);
    background-position: -1px -1px;
    animation: lb-in 0.18s ease-out;
  }
  .lightbox[hidden] { display: none; }
  @keyframes lb-in { from { opacity: 0; } to { opacity: 1; } }
  .lb-close {
    position: absolute;
    top: max(16px, env(safe-area-inset-top, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
  }
  .lb-fig {
    margin: 0;
    display: grid;
    justify-items: center;
    gap: 14px;
    max-width: 100%;
  }
  .lb-fig img, .lb-fig svg {
    display: block;
    max-width: min(92vw, 1100px);
    max-height: calc(100vh - 170px);
    max-height: calc(100svh - 170px);
    width: auto;
    height: auto;
    background: var(--paper);
    border: 4px solid var(--ink);
    box-shadow: 8px 8px 0 var(--ink);
  }
  .lb-fig svg {
    height: calc(100vh - 170px);
    height: calc(100svh - 170px);
    aspect-ratio: 5 / 7;
  }
  .lb-fig figcaption {
    background: var(--paper);
    border: 3px solid var(--ink);
    padding: 4px 12px;
    font-family: var(--f-mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    max-width: 92vw;
    text-align: center;
  }
  @media (max-width: 860px) {
    .nav { gap: 10px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
    .circle-btn { width: 42px; height: 42px; border-width: 3px; }
    .circle-btn svg { width: 20px; height: 20px; }
    .lightbox { padding-top: 68px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .lightbox { animation: none; }
    .circle-btn { transition: none; }
  }

  /* Pantallas estrechas*/
  @media (max-width: 860px) {
    :root { --cell: 96px; --line: 3px; }
    #viewport { grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr 1fr; }
    .divider { left: 0; right: 0; top: 50%; bottom: auto; width: auto; height: 6px; margin: -3px 0 0; }
    .inner { gap: 8px; padding-block: 10px; }
    .strip.left  .inner { padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .strip.right .inner { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
    .bar span:first-child { display: none; }
    .bar { justify-content: flex-end; font-size: 10.5px; }
    .bar span { padding: 2px 7px; border-width: 2px; }
    .strip.left  .stage, .strip.right .stage { align-content: center; padding: 0; }
    .stage, .panel.flip .stage { grid-template-columns: minmax(0, clamp(76px, 20vw, 150px)) minmax(0, 1fr); gap: 16px; }
    .panel.flip .stage { grid-template-columns: minmax(0, 1fr) minmax(0, clamp(76px, 20vw, 150px)); }
    .poster { border-width: 3px; box-shadow: 6px 6px 0 var(--ink); }
    .label { border-width: 3px; padding: 10px 12px; gap: 6px; max-width: none; }
    .label h2 { font-size: clamp(1rem, 4.4vw, 1.5rem); }
    .label p {
      font-size: 0.8rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta { display: none; }
  }
  @media (max-height: 640px) and (min-width: 861px) {
    .meta { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .inner { transform: none !important; }
  }
</style>

<main id="track" aria-label="Carteles">
  <div id="viewport">
    <div class="strip left" id="stripL"></div>
    <div class="strip right" id="stripR"></div>
    <div class="divider" aria-hidden="true"></div>
  </div>
</main>

<nav class="nav" aria-label="Navegación">
  <a class="circle-btn" href="index.html" aria-label="Volver al inicio" title="Volver al inicio">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.8V20h13V9.8"/><path d="M10 20v-5.5h4V20"/></svg>
  </a>
  <a class="circle-btn" href="pdf/CV/CV.pdf" aria-label="Ir al currículum" title="Ir al currículum">

  </a>
</nav>

<div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Cartel ampliado">
  <button id="lbClose" class="circle-btn lb-close" type="button" aria-label="Cerrar" title="Cerrar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <figure id="lbFig" class="lb-fig"></figure>
</div>

<script>
  /*
    Carteles. Orden de lectura: 1 a la izquierda, 2 a la derecha, 3 a la izquierda…
    Para usar tu propia imagen, añade  img: "ruta/o/data-uri"  y el cartel de ejemplo se sustituye.
  */
  function svgOpen(n) {
    return '<svg viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cartel de ejemplo ' + n + '">';
  }
  function tag(n) { return (n < 10 ? "0" : "") + n; }

  function artCircle(n, c) {
    return svgOpen(n) +
      '<rect width="500" height="700" fill="' + c.bg + '"/>' +
      '<circle cx="250" cy="290" r="170" fill="' + c.shape + '"/>' +
      '<rect x="0" y="520" width="500" height="60" fill="' + c.ink + '"/>' +
      '<rect x="40" y="610" width="260" height="14" fill="' + c.ink + '"/>' +
      '<rect x="40" y="636" width="180" height="14" fill="' + c.ink + '"/>' +
      '<text x="40" y="70" font-family="Archivo,Arial,sans-serif" font-weight="900" font-size="34" fill="' + c.ink + '">CARTEL ' + tag(n) + '</text>' +
      '</svg>';
  }
  function artStripes(n, c) {
    var s = "";
    for (var i = -6; i < 14; i++) {
      s += '<rect x="' + (i * 70) + '" y="-200" width="34" height="1100" fill="' + c.stripe + '" transform="rotate(28 250 350)"/>';
    }
    return svgOpen(n) +
      '<defs><clipPath id="c' + n + '"><rect width="500" height="700"/></clipPath></defs>' +
      '<rect width="500" height="700" fill="' + c.bg + '"/>' +
      '<g clip-path="url(#c' + n + ')">' + s + '</g>' +
      '<rect x="60" y="410" width="380" height="190" fill="' + c.block + '"/>' +
      '<text x="84" y="520" font-family="Archivo,Arial,sans-serif" font-weight="900" font-size="64" fill="' + c.text + '">' + c.word + '</text>' +
      '<text x="84" y="570" font-family="Archivo,Arial,sans-serif" font-weight="500" font-size="22" fill="' + c.text + '">CARTEL ' + tag(n) + '</text>' +
      '</svg>';
  }
  function artArcs(n, c) {
    var s = "";
    for (var i = 0; i < 4; i++) {
      var r = 200 - i * 42;
      s += '<path d="M' + (250 - r) + ' 600 A' + r + ' ' + r + ' 0 0 1 ' + (250 + r) + ' 600 Z" fill="' + c.cols[i] + '"/>';
    }
    return svgOpen(n) +
      '<rect width="500" height="700" fill="' + c.bg + '"/>' + s +
      '<rect x="0" y="600" width="500" height="100" fill="' + c.ink + '"/>' +
      '<text x="30" y="665" font-family="Archivo,Arial,sans-serif" font-weight="900" font-size="30" fill="' + c.paper + '">CARTEL ' + tag(n) + '</text>' +
      '<text x="30" y="70" font-family="Archivo,Arial,sans-serif" font-weight="900" font-size="54" fill="' + c.ink + '">ARCOS</text>' +
      '</svg>';
  }
  function artDots(n, c) {
    var s = "";
    for (var y = 0; y < 10; y++) {
      for (var x = 0; x < 7; x++) {
        var d = Math.hypot(x - 3, y - 4.5);
        var r = Math.max(3, 30 - d * 6);
        s += '<circle cx="' + (50 + x * 66.7) + '" cy="' + (60 + y * 58) + '" r="' + r.toFixed(1) + '" fill="' + c.dot + '"/>';
      }
    }
    return svgOpen(n) +
      '<rect width="500" height="700" fill="' + c.bg + '"/>' + s +
      '<text x="30" y="672" font-family="Archivo,Arial,sans-serif" font-weight="900" font-size="30" fill="' + c.text + '">CARTEL ' + tag(n) + '</text>' +
      '</svg>';
  }
  function artLetters(n, c) {
    return svgOpen(n) +
      '<rect width="500" height="700" fill="' + c.bg + '"/>' +
      '<text x="-10" y="470" font-family="Archivo,Arial,sans-serif" font-weight="900" font-size="520" fill="' + c.ink + '" textLength="520" lengthAdjust="spacingAndGlyphs">' + c.word + '</text>' +
      '<rect x="30" y="560" width="440" height="6" fill="' + c.ink + '"/>' +
      '<text x="30" y="620" font-family="Archivo,Arial,sans-serif" font-weight="900" font-size="30" fill="' + c.ink + '">CARTEL ' + tag(n) + '</text>' +
      '</svg>';
  }

  var POSTERS = [
    { titulo: "Celler de Roure y Carmes Ahumadas", costo: "1.2h", formato: "50 × 70 cm", Objetivo: "Serigrafía, 3 tintas",
      texto: "Creada para una cena de vinos de alto nivel acompañados de bocados ahumados. Destaca por su elegante caligrafía manuscrita (script) sobre un fondo texturizado con un trazo circular simple.",
      img: "img/carteles/CellerDelRoure.png"},
    { titulo: "Balonmano S.XX", costo: "1.9h", formato: "A3", Objetivo: "Composición digital deportiva",
      texto: "Evento que reunió a mas de 60 exjugadores del Balonmano del S.XX de la ciudad de Burriana y sus alrededores. Rompiendo con la estética gastronómica y adoptando un tono deportivo.",
      img: "img/carteles/Balonmano.jpg"},
    { titulo: "Boqueron y Cerveza", costo: "2h", formato: "A4", Objetivo: "Cartel de feria",
      texto: "La combinación de pescados azules y grasos combinan de maravilla con el amargo, carbónico y refrescante de la cerveza. Póster inspirado en fiestas y ferias tradicionales, que utilizan bloques de color muy marcados y diferenciables.",
      img: "img/carteles/BqueronesYCerveza.jpg"},
    { titulo: "Listado de Cenas", costo: "2025", formato: "A3", Objetivo: "Elemento real a idea base",
      texto: "Plasmado en una pared de Trinquete Valenciano, se muestra la lista de cenas en las escaleras del propio campo de juego.",
      img: "img/carteles/CenasViernes2026.jpeg"},
    { titulo: "Dulces Manuel", costo: "25min", formato: "2:3cm", Objetivo: "Imagen real retocada con IA",
      texto: " Dulces impecables junto a joyas de los vinos dulces internacionales. El broche de oro lo puso una emotiva masterclass que conectó postres personales y vinos de una forma inolvidable.",
      img: "img/carteles/DulcesManuel.png"},
    { titulo: "Sidra y Asturias", costo: "1.3h", formato: "A4", Objetivo: "Gama cromática de Bandera",
      texto: "Cartel asturiano muestra la tradicional cruz de la victoria, un escanciador de sidra estilizado con paleta de colores propia de la bandera.",
      img: "img/carteles/SidraAsturia.jpg"},
    { titulo: "Galicia y sus tapas", costo: "3.2h", formato: "A3", Objetivo: "Vectorial con Acuarela",
      texto: "Empleando acuarelas y trazos orgánicos azules en forma de manchas, se recrea el mapa Gallego rodeado de mar y elementos característicos de la cena.",
      img: "img/carteles/TapasGallegas.jpg"},
    { titulo: "Tapas y Vinos Italianos", costo: "1.2h", formato: "A3", Objetivo: "Collage IA + Texto",
      texto: "Elementos visuales icónicos estrechamente vinculados con la cultura y geografía de las regiones que protagonizan el evento. Así como un estilo más cargado.",
      img: "img/carteles/TapasItalianas.png"},
    { titulo: "Vinos del Duero", costo: "2.3h", formato: "50 × 70 cm", Objetivo: "Práctica vectorial",
      texto: "Con trazado vectorial e imágenes de dibujo digital para representar los platos. Recorremos el río duero deteniéndonos sólamente en las graneds bodegas.",
      img: "img/carteles/VinosDuero.png"},
    { titulo: "Título del cartel 10", costo: "45min", formato: "2:3", Objetivo: "Historia para red social",
      texto: "Ilustración digital minimalista con paleta reducida y diseño limpio.",
      img: "img/carteles/VinosDulcesTartas.png"},
  ];

  //Cartel de ejemplo. Sustituye img: por estos art: (CARTELES DE EJEMPLO)
  //art: function () { return artStripes(2, { bg: "#1d3557", stripe: "#f1faee", block: "#e63946", text: "#f1faee", word: "RITMO" }); } },
  //art: function () { return artArcs(3, { bg: "#2a9d8f", cols: ["#e9c46a", "#f4a261", "#264653", "#e76f51"], ink: "#0b0b0b", paper: "#fbfbf9" }); } },
  //art: function () { return artDots(4, { bg: "#141414", dot: "#ff6b35", text: "#fbfbf9" }); } },
  //art: function () { return artLetters(5, { bg: "#ff7ab6", ink: "#0b0b0b", word: "Aa" }); } },
  //art: function () { return artLetters(5, { bg: "#ff7ab6", ink: "#0b0b0b", word: "Aa" }); } },
  //art: function () { return artCircle(6, { bg: "#3a86ff", shape: "#ffbe0b", ink: "#0b0b0b" }); } },
  //art: function () { return artArcs(8, { bg: "#e63946", cols: ["#f1faee", "#a8dadc", "#457b9d", "#1d3557"], ink: "#0b0b0b", paper: "#fbfbf9" }); } },
  //art: function () { return artDots(9, { bg: "#f1faee", dot: "#1d3557", text: "#1d3557" }); } },
  //art: function () { return artLetters(10, { bg: "#c8f169", ink: "#0b0b0b", word: "Rr" }); } }

  (function () {
    var total = POSTERS.length;
    var left = [], right = [];
    POSTERS.forEach(function (p, i) { (i % 2 === 0 ? left : right).push({ p: p, n: i + 1 }); });

    function pad(n) { return (n < 10 ? "0" : "") + n; }

    function build(strip, list) {
      list.forEach(function (item, k) {
        var p = item.p;
        var sec = document.createElement("section");
        sec.className = "panel" + (k % 2 === 1 ? " flip" : "");
        sec.setAttribute("aria-label", p.titulo);
        sec.style.zIndex = String(k + 1);
        var media = p.img ? '<img src="' + p.img + '" alt="' + p.titulo + '">' : p.art();
        sec.innerHTML =
          '<div class="inner">' +
            '<div class="bar"><span>Portafolio · Carteles</span><span>' + pad(item.n) + ' / ' + pad(total) + '</span></div>' +
            '<div class="stage">' +
              '<figure class="poster" role="button" tabindex="0" data-title="' + p.titulo.replace(/"/g, "&quot;") + '" aria-label="Ampliar cartel: ' + p.titulo.replace(/"/g, "&quot;") + '">' + media + '</figure>' +
              '<div class="label">' +
                '<h2>' + p.titulo + '</h2>' +
                '<p>' + p.texto + '</p>' +
                '<dl class="meta">' +
                  '<dt>Costo</dt><dd>' + p.costo + '</dd>' +
                  '<dt>Formato</dt><dd>' + p.formato + '</dd>' +
                  '<dt>Objetivo</dt><dd>' + p.Objetivo + '</dd>' +
                '</dl>' +
              '</div>' +
            '</div>' +
          '</div>';
        strip.appendChild(sec);
      });
    }

    var stripL = document.getElementById("stripL");
    var stripR = document.getElementById("stripR");
    var viewport = document.getElementById("viewport");
    var track = document.getElementById("track");
    build(stripL, left);
    build(stripR, right);

    // Visor: al pulsar un cartel se muestra grande y completo
    var lightbox = document.getElementById("lightbox");
    var lbFig = document.getElementById("lbFig");
    var lbClose = document.getElementById("lbClose");
    var lastPoster = null;

    function openLightbox(poster) {
      var img = poster.querySelector("img");
      var svg = poster.querySelector("svg");
      var media = "";
      if (img) {
        media = '<img src="' + img.getAttribute("src") + '" alt="' + (img.getAttribute("alt") || "") + '">';
      } else if (svg) {
        media = svg.outerHTML;
      }
      lbFig.innerHTML = media + '<figcaption>' + (poster.getAttribute("data-title") || "") + '</figcaption>';
      lastPoster = poster;
      lightbox.hidden = false;
      lbClose.focus();
    }
    function closeLightbox() {
      lightbox.hidden = true;
      lbFig.innerHTML = "";
      if (lastPoster) { lastPoster.focus({ preventScroll: true }); }
    }

    viewport.addEventListener("click", function (e) {
      var poster = e.target.closest ? e.target.closest(".poster") : null;
      if (poster) { openLightbox(poster); }
    });
    viewport.addEventListener("keydown", function (e) {
      var t = e.target;
      if ((e.key === "Enter" || e.key === " ") && t.classList && t.classList.contains("poster")) {
        e.preventDefault();
        openLightbox(t);
      }
    });
    lbClose.addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", function (e) { if (e.target === lightbox) { closeLightbox(); } });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !lightbox.hidden) { closeLightbox(); }
    });
    // Con el visor abierto, la página de detrás no se desplaza
    lightbox.addEventListener("wheel", function (e) { e.preventDefault(); }, { passive: false });
    lightbox.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

    var panelsL = Array.prototype.slice.call(stripL.children);
    var panelsR = Array.prototype.slice.call(stripR.children);
    var steps = Math.max(panelsL.length, panelsR.length) - 1;

    // Un paso de scroll es una pantalla. Alturas en svh con respaldo en vh.
    var unit = "100";
    track.style.height = (steps + 1) * 100 + "vh";
    if (window.CSS && CSS.supports && CSS.supports("height", "1svh")) {
      track.style.height = (steps + 1) * 100 + "svh";
    }

    function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
    function clamp(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }

    // Izquierda se mueve en [k-1+0.1, k-0.5]; derecha en [k-1+0.55, k-0.05]. Nunca a la vez.
    function layout(panels, offset, dir, p) {
      var ts = [0];
      for (var k = 1; k < panels.length; k++) {
        var t = ease(clamp((p - ((k - 1) + offset)) / 0.4));
        ts[k] = t;
        panels[k].style.transform = "translate3d(0," + (dir * (1 - t) * 100).toFixed(2) + "%,0)";
      }
      for (var j = 0; j < panels.length; j++) {
        var c = j + 1 < panels.length ? ts[j + 1] : 0;
        // Los carteles fuera de vista o totalmente tapados no reciben foco ni clics
        var shown = (j === 0 || ts[j] > 0) && !(j + 1 < panels.length && ts[j + 1] >= 1);
        panels[j].style.visibility = shown ? "visible" : "hidden";
        panels[j].firstChild.style.setProperty("--cover", c.toFixed(3));
      }
    }

    function measure() {
      viewport.style.setProperty("--rx", stripR.offsetLeft + "px");
      viewport.style.setProperty("--ry", stripR.offsetTop + "px");
    }

    function update() {
      var vh = window.innerHeight || 1;
      var p = -track.getBoundingClientRect().top / vh;
      p = Math.min(steps, Math.max(0, p));
      layout(panelsL, 0.1, 1, p);
      layout(panelsR, 0.55, -1, p);
      ticking = false;
    }

    var ticking = false;
    function onScroll() {
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    }
    function onResize() { measure(); onScroll(); }

    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onResize);
    measure();
    update();
  })();
</script>

</body></html>
